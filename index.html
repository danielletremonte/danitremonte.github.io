<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C0C0C">
  <title>Dani Tremonte</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Mode switch: circular reveal of the new theme from the name's center */
    @keyframes vtCircleIn {
      from { clip-path: circle(0 at var(--vt-x, 50%) var(--vt-y, 50%)); }
      to   { clip-path: circle(160vmax at var(--vt-x, 50%) var(--vt-y, 50%)); }
    }
    /* Default (project/about): gentle crossfade dissolve */
    ::view-transition-old(root),
    ::view-transition-new(root) { animation-duration: 0.45s; animation-timing-function: ease; }

    /* Main page: circle reveal overrides the crossfade */
    html.vt-mode::view-transition-old(root) { animation: none; }
    html.vt-mode::view-transition-new(root) {
      animation: vtCircleIn 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }

    :root {
      --bg:          #0C0C0C;
      --text:        #E8E8E4;
      --muted:       rgba(232, 232, 228, 0.38);
      --accent:      #F472B6;
      --border:      rgba(255, 255, 255, 0.08);
      --error:       #D97070;
      --line:        rgba(255, 255, 255, 0.14);
      --line-strong: rgba(255, 255, 255, 0.30);
      --fill:        rgba(255, 255, 255, 0.04);
      --fill-2:      rgba(255, 255, 255, 0.08);
      --hover:       rgba(255, 255, 255, 0.06);
      --panel:       #1E1E20;
      --font:        'JetBrains Mono', 'Courier New', monospace;
      --sz:          14px;
      --lh:          1.7;
    }

    /* Designer mode: light, elegant serif, a little more motion */
    body.light {
      --bg:          #FAF9F7;
      --text:        #1A1A1A;
      --muted:       rgba(26, 26, 26, 0.52);
      --accent:      #DB2777;
      --border:      rgba(0, 0, 0, 0.10);
      --error:       #C0392B;
      --line:        rgba(0, 0, 0, 0.16);
      --line-strong: rgba(0, 0, 0, 0.34);
      --fill:        rgba(0, 0, 0, 0.03);
      --fill-2:      rgba(0, 0, 0, 0.06);
      --hover:       rgba(0, 0, 0, 0.05);
      --panel:       #FFFFFF;
      --font:        'Inter', -apple-system, system-ui, sans-serif;
      --sz:          15px;
      --lh:          1.6;
    }

    /* Designer mode runs tighter and bolder, Swiss-poster style */
    body.light { letter-spacing: -0.01em; }
    body.light .out-line.is-bright { font-weight: 700; }

    /* More pronounced, slower line reveal in designer mode */
    body.light .out-line { transition: opacity 0.4s ease, transform 0.4s ease; }
    body.light .out-line.pending { transform: translateY(8px); }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: var(--sz);
      line-height: var(--lh);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Layout: starts full-width, splits on first command ── */
    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh; /* mobile browsers: exclude collapsing URL bar */
    }

    .terminal-side {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
      transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .preview-side {
      width: 0;
      height: 100vh;
      position: relative;
      background: var(--bg);
      overflow: hidden;
      flex-shrink: 0;
      transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .layout.is-split .terminal-side { width: 33.333%; }
    .layout.is-split .preview-side  { width: 66.666%; border-left: 1px solid var(--border); }

    /* ── Bio (position: absolute, centered in terminal-side) ── */
    .bio {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 10ch);
      max-width: 520px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .layout.is-split .bio {
      opacity: 0;
      pointer-events: none;
    }

    .bio-line { display: block; }
    .bio-line + .bio-line { margin-top: 1px; }

    .bio .is-muted { color: var(--muted); }

    .bio-accent { color: var(--accent); }

    /* Designer mode: name as a giant logo wordmark that fills the page */
    body.light .bio {
      width: 96vw;
      max-width: none;
      text-align: center;
      transform: translate(-50%, calc(-50% - 30px));
    }

    /* Target the name by CLASS (not :first-child — the greeting is now first) */
    body.light .bio-name {
      display: block;
      pointer-events: auto;
      font-size: clamp(2rem, 9.1vw, 14rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.05em;
      color: var(--text);
      margin-bottom: 20px;
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    body.light .bio-line:not(.bio-name) {
      font-size: clamp(15px, 1.1vw, 18px);
      font-weight: 300;
      line-height: 1.5;
      max-width: 580px;
      margin: 0 auto;
      transition: color 0.3s ease;
    }

    /* Waving "Hi!" greeting — sits above the name, revealed on hover */
    .bio-greeting {
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease, color 0.3s ease;
      font-weight: 700;
      color: var(--accent);
      font-size: clamp(2rem, 5vw, 4rem);
      margin-bottom: 10px;
    }

    body.light .bio-greeting { display: block; }
    body.light .bio:has(.bio-name:hover) .bio-greeting { opacity: 1; }

    .bio-greeting .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 1.3s ease-in-out infinite;
    }

    /* Greeting letters fade in one by one; inline (not inline-block) to keep
       the font's natural kerning. Opacity-only so inline elements can animate. */
    .greet-text .gl { opacity: 0; }
    body.light .bio:has(.bio-name:hover) .greet-text .gl {
      animation: fadeInLetter 0.25s ease forwards;
    }
    @keyframes fadeInLetter {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(18deg); }
      40%      { transform: rotate(-12deg); }
      60%      { transform: rotate(14deg); }
      80%      { transform: rotate(-6deg); }
    }

    /* Soft vintage-pink wash when hovering the name (designer mode) */
    body.light:has(.bio-name:hover) { background: #FBE3EE; }

    /* Once a project opens, the bio is hidden — stop its (invisible) hover
       from tinting the left panel pink */
    .layout.is-split .bio-name { pointer-events: none; }

    /* ── Pink dot cursor (designer mode only, blit-style) ── */
    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
    }

    body.light .cursor-dot { display: block; }
    body.light, body.light * { cursor: none !important; }

    /* Links: same gray as body text, elegant dotted underline */
    .bio-link {
      color: var(--muted);
      text-decoration: underline dotted;
      text-decoration-color: var(--line-strong);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      pointer-events: auto;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    .bio-link:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    /* LinkedIn hovers blue (MCP color); Everydrop hovers purple (its project color) */
    .bio-link.link-mcp:hover { color: #7DA2FF; text-decoration-color: #7DA2FF; }
    body.light .bio-link.link-mcp:hover { color: #2962FF; text-decoration-color: #2962FF; }

    .bio-link.link-everydrop:hover { color: #AA8BFC; text-decoration-color: #AA8BFC; }
    body.light .bio-link.link-everydrop:hover { color: #7C3AED; text-decoration-color: #7C3AED; }

    /* Inline CTA link (e.g. "Let's talk over email"): underline only on hover */
    .cta-link { color: rgba(232, 232, 228, 0.62); text-decoration: none; text-underline-offset: 3px; transition: color 0.2s ease; }
    body.light .cta-link { color: var(--muted); }
    .cta-link:hover { text-decoration: underline; text-decoration-thickness: 1px; }

    /* ── Terminal output ── */
    .terminal {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 68px 42px 0;
      min-height: 0;
      cursor: text;
    }

    .output {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: 0;
    }

    /* Bottom-align content when short, but keep the panel scrollable
       when it grows (justify-content: flex-end breaks scrolling) */
    .output > :first-child { margin-top: auto; }

    .output::-webkit-scrollbar { display: none; }

    .out-line {
      line-height: var(--lh);
      white-space: pre-wrap;
      word-break: break-word;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    /* Lines start hidden and reveal in sequence, like terminal output */
    .out-line.pending {
      opacity: 0;
      transform: translateY(3px);
    }

    /* User commands: terminal prompt style — colored ❯ glyph, bright text */
    .out-line.is-cmd { letter-spacing: 0.01em; }
    .out-line.is-cmd .sym { font-weight: 700; }
    .out-line.is-cmd    { color: var(--text); margin-top: 8px; }
    .out-line.is-resp   { color: var(--text); }
    .out-line.is-tags   { color: var(--muted); }
    .out-line.is-bright { color: var(--text); font-weight: 700; }
    .out-line.is-error  { color: var(--error); }
    /* Tight paragraph spacing in both modes (was larger in coder) */
    .out-line.is-blank  { height: calc(var(--sz) * var(--lh) * 0.5); display: block; margin: 2px 0; }

    /* Designer mode: darker, more readable body text (titles + tags stay muted) */
    body.light .out-line.is-resp { color: rgba(0, 0, 0, 0.9); }

    /* Clickable lines (project list) */
    .out-line.is-click { cursor: pointer; transition: color 0.15s ease; }
    .out-line.is-click:hover { color: var(--accent); }

    .sym { color: var(--accent); }

    /* Idle % before any project is open — same gray as the hint text */
    .sym-idle { color: var(--muted); }

    /* Per-project command colors ($ + typed prompt).
       Note: #EBF1FF reads as plain white on the dark bg, so dark mode
       uses a lighter tint of the same blue that stays visibly blue. */
    .cmd-p0 { color: #7DA2FF; }
    body.light .cmd-p0 { color: #2962FF; }

    .cmd-p1 { color: #AA8BFC; }
    body.light .cmd-p1 { color: #7C3AED; }

    .cmd-p2 {
      background-image: linear-gradient(90deg, #DDE7F1, #D6FAEE, #EBE3F3);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    body.light .cmd-p2 {
      background-image: linear-gradient(90deg, #4C6A8F, #1F8A66, #7B5FA8);
    }

    /* Links inside terminal output */
    .term-link {
      color: var(--accent);
      text-decoration: underline dotted;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    /* ── Inline media (mobile): assets flow inside the output like a feed ── */
    .media-line { margin: 6px 0; }

    .media-line video,
    .media-line img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .media-line img.inline-blob {
      width: 210px;
      aspect-ratio: 0.85;
      object-fit: cover;
      object-position: center top;
      border-radius: 60% 40% 55% 45% / 50% 60% 40% 55%;
      /* Pink outline instead of a drop shadow: light pink (coder) / dark pink (designer) */
      border: 2px solid var(--accent);
      animation:
        blobMorph 9s ease-in-out infinite alternate,
        blobFloat 6s ease-in-out infinite alternate;
      margin: 10px auto 6px;
    }


    /* ── Input area ── */
    .input-area {
      padding: 16px 42px 40px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Container anchors the palette to the same width as the input */
    .input-container {
      position: relative;
      width: 100%;
      max-width: 560px;
      transition: max-width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .layout.is-split .input-container { max-width: 100%; }

    .input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      /* Fill = the mode's own page background at 90% opacity (dark in coder, cream in designer) */
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 10px 10px 14px;
      transition: border-color 0.2s ease, background 0.35s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--line-strong);
    }

    /* Designer mode: softer, more rounded input (8px more than coder's 6px) */
    body.light .input-wrapper { border-radius: 14px; }

    /* Blinking cursor */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: var(--text);
      animation: blink 1.1s step-end infinite;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .cursor-blink.hidden { display: none; }

    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: var(--lh);
      caret-color: transparent;
    }
    /* Placeholder hint = the same light grey as the prompt heading (web + mobile) */
    .cmd-input::placeholder { color: var(--muted); opacity: 1; }

    /* Slash + theme buttons inside input */
    .slash-btn,
    .theme-btn {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 5px;
      background: var(--fill-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      padding: 0;
      line-height: 1;
    }

    .slash-btn:hover,
    .theme-btn:hover { background: var(--hover); color: var(--text); }

    .theme-btn svg { width: 14px; height: 14px; display: block; }

    /* Hover label pills (Light / Dark / Commands) */
    .slash-btn,
    .theme-btn { position: relative; }

    .slash-btn::after,
    .theme-btn::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 9px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-family: var(--font);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(3px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      z-index: 300;
    }

    .slash-btn:hover::after,
    .theme-btn:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* While the command palette is open, suppress the button hover labels */
    .cmd-palette.visible ~ .input-wrapper .slash-btn::after,
    .cmd-palette.visible ~ .input-wrapper .theme-btn::after {
      opacity: 0 !important;
    }

    /* Anchors the palette directly above the input box (chips sit outside this) */
    .input-anchor { position: relative; }

    /* ── Command palette (anchored to the input box) ── */
    .cmd-palette {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      z-index: 200;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      display: none;
    }

    .cmd-palette.visible { display: block; }

    /* Dim backdrop for the mobile bottom sheet (hidden on desktop) */
    .sheet-backdrop { display: none; }

    .palette-filter {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .palette-filter input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: var(--sz);
      line-height: var(--lh);
    }

    .palette-filter input::placeholder { color: var(--muted); }

    .palette-body { padding: 6px 0; }
    .palette-body::-webkit-scrollbar { display: none; }

    .palette-section {
      padding: 8px 16px 4px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .palette-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .palette-item:hover,
    .palette-item.selected { background: var(--hover); }

    .palette-item-label { color: var(--text); }
    .palette-item-desc  { color: var(--muted); font-size: 12px; }

    /* Designer mode: smaller palette (Inter renders larger than the mono) */
    body.light .palette-item    { padding: 7px 16px; font-size: 14px; }
    body.light .palette-section { font-size: 10px; }


    /* ── Right: media preview ── */
    .preview-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .preview-item::-webkit-scrollbar { display: none; }

    .preview-item.active { opacity: 1; pointer-events: auto; }

    /* Media stacks at natural aspect ratio with a fixed gap between assets */
    .preview-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .media-block {
      width: 100%;
      flex-shrink: 0;
    }

    .media-block video,
    .media-block img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Blob variant (about photo): morphing organic shape, centered in panel */
    .media-block.blob {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-block.blob img {
      width: min(80%, 600px);
      aspect-ratio: 0.85;
      object-fit: cover;
      object-position: center top;
      border-radius: 60% 40% 55% 45% / 50% 60% 40% 55%;
      /* Pink outline instead of a drop shadow: light pink (coder) / dark pink (designer) */
      border: 2px solid var(--accent);
      animation:
        blobMorph 9s ease-in-out infinite alternate,
        blobFloat 6s ease-in-out infinite alternate;
    }

    @keyframes blobMorph {
      0%   { border-radius: 60% 40% 55% 45% / 50% 60% 40% 55%; }
      33%  { border-radius: 45% 55% 40% 60% / 60% 45% 55% 42%; }
      66%  { border-radius: 55% 45% 62% 38% / 44% 56% 42% 58%; }
      100% { border-radius: 42% 58% 46% 54% / 56% 42% 58% 44%; }
    }

    @keyframes blobFloat {
      0%   { transform: translateY(-8px); }
      100% { transform: translateY(10px); }
    }

    /* ── Suggested prompt chips (above input, shown when a project is open) ── */
    .prompt-chips {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .prompt-chips.visible { display: flex; }

    /* Designer mode: a little more breathing room above the input */
    body.light .prompt-chips { margin-bottom: 18px; }

    .chip {
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--line);
      background: var(--fill-2);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.4;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .chip:hover { border-color: var(--line-strong); }

    /* Designer mode: longer, roomier buttons (match coder proportions) */
    body.light .chip { font-size: 14px; padding: 8px 18px; }

    /* Chips take the open project's color */
    .chip.chip-p0 { color: #7DA2FF; border-color: rgba(125, 162, 255, 0.40); background: rgba(125, 162, 255, 0.08); }
    body.light .chip.chip-p0 { color: #2962FF; border-color: rgba(41, 98, 255, 0.35); background: rgba(41, 98, 255, 0.06); }

    .chip.chip-p1 { color: #AA8BFC; border-color: rgba(170, 139, 252, 0.40); background: rgba(170, 139, 252, 0.08); }
    body.light .chip.chip-p1 { color: #7C3AED; border-color: rgba(124, 58, 237, 0.35); background: rgba(124, 58, 237, 0.06); }

    .chip.chip-p2 { color: #9BE8CD; border-color: rgba(155, 232, 205, 0.40); background: rgba(155, 232, 205, 0.08); }
    body.light .chip.chip-p2 { color: #1F8A66; border-color: rgba(31, 138, 102, 0.35); background: rgba(31, 138, 102, 0.06); }

    /* ── Coder-mode terminal prompt list (chips are used in designer mode) ── */
    .menu { margin: 2px 0 6px; }
    /* Heading + options use --text: white in coder, black in designer */
    .menu-q { color: var(--text); margin-bottom: 6px; }
    .menu-opt {
      color: var(--text);
      cursor: pointer;
      padding: 1px 0;
      transition: color 0.12s ease;
    }
    .menu-opt:not(.sel):hover { color: var(--text); }
    .menu-opt .caret { display: inline-block; width: 1ch; visibility: hidden; }
    .menu-opt.sel .caret { visibility: visible; }
    .menu-p0 .menu-opt.sel { color: #7DA2FF; }
    .menu-p1 .menu-opt.sel { color: #AA8BFC; }
    .menu-p2 .menu-opt.sel { color: #9BE8CD; }

    /* Input text takes the open project's color */
    .cmd-input.input-p0 { color: #7DA2FF; }
    body.light .cmd-input.input-p0 { color: #2962FF; }

    .cmd-input.input-p1 { color: #AA8BFC; }
    body.light .cmd-input.input-p1 { color: #7C3AED; }

    .cmd-input.input-p2 { color: #9BE8CD; }
    body.light .cmd-input.input-p2 { color: #1F8A66; }

    /* ── Mobile: single column, media inline, no side panel ──
       Kept last in the stylesheet so these rules win the cascade. */
    @media (max-width: 768px) {
      .preview-side { display: none; }

      .terminal-side,
      .layout.is-split .terminal-side { width: 100%; }

      nav { padding: 20px; }

      .terminal { padding: 16px 20px 0; }

      /* Input bar floats over the feed; content scrolls behind it and fades out
         (Claude Code style): transparent at the top → solid page color at the bottom */
      .input-area {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 44px 16px 24px;   /* the 44px top offset = where the input pill begins */
        z-index: 271;              /* above the sheet backdrop (265) so palette taps land on items, not the dim layer */
        /* Feed stays fully crisp above the input; the page-color wash begins at the pill's top edge */
        background: linear-gradient(to bottom, transparent 0, transparent 44px, var(--bg) 80px);
        pointer-events: none;      /* the transparent fade zone lets taps/scroll reach the feed behind it */
      }
      .input-area > * { pointer-events: auto; }   /* but the input + palette stay interactive */

      /* Give the feed room so its last line can scroll clear of the floating input.
         display:block (not flex) so iOS Safari scrolls the feed reliably — a flex
         column with overflow-y:auto often refuses to scroll on iOS. */
      .output {
        display: block;
        padding-bottom: 92px;
      }

      .bio { width: calc(100% - 40px); }

      /* Intro reads as one flowing paragraph, not forced line breaks */
      .bio-line { display: inline; }
      .bio-line + .bio-line { margin-top: 0; }
      .bio-line::after { content: ' '; }

      /* 16px input prevents iOS auto-zoom on focus */
      .cmd-input { font-size: 16px; }

      /* Command palette becomes a bottom sheet */
      .sheet-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
        z-index: 265;          /* dims everything, including the input bar */
      }
      .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }

      .cmd-palette {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;             /* true bottom sheet, flush to the screen edge */
        top: auto;
        max-height: 72dvh;
        border-radius: 20px 20px 0 0;   /* rounded top corners only */
        transform: translateY(100%);
        opacity: 0;
        pointer-events: none;      /* never intercept taps meant for the input */
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        z-index: 270;          /* sits on top of the input bar */
        padding-top: 8px;
        padding-bottom: env(safe-area-inset-bottom, 8px);
      }
      .cmd-palette.visible {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      /* Hide the floating button labels while the sheet is open */
      .cmd-palette.visible ~ .input-wrapper .slash-btn::after,
      .cmd-palette.visible ~ .input-wrapper .theme-btn::after {
        opacity: 0 !important;
      }

      /* Grab handle at the top of the sheet */
      .cmd-palette::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--line-strong);
        margin: 4px auto 10px;
      }

      .palette-body { max-height: calc(72dvh - 40px); overflow-y: auto; padding-bottom: 8px; }

      /* Roomier tap targets in the sheet */
      .palette-item { padding: 13px 20px; font-size: 15px; }
      .palette-section { padding: 10px 20px 4px; }

      /* Output reads top-down on mobile, not bottom-anchored */
      .output > :first-child { margin-top: 0; }

      /* No fake cursor dot or hover tooltips on touch */
      body.light .cursor-dot { display: none !important; }
      .slash-btn::after, .theme-btn::after { display: none !important; }

      /* Input hint matches the portfolio font size (not the 16px input) */
      .cmd-input::placeholder { font-size: 14px; }

      /* Name on its own line (matches web), both modes */
      .bio-name { display: block; }
      body:not(.light) .bio-name { margin-bottom: 8px; }

      /* Designer chips flow after the media, left-aligned (not pinned to bottom) */
      .inline-chips { justify-content: flex-start; margin: 8px 0 4px; }
    }
  </style>
</head>
<body>

<!-- Dim backdrop behind the mobile command bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>

<!-- Pink dot cursor (visible in designer mode only) -->
<div class="cursor-dot" id="cursorDot"></div>

<div class="layout" id="layout">

  <!-- Terminal side -->
  <div class="terminal-side">

    <div class="bio" id="bio"></div>

    <div class="terminal" id="terminal">
      <div class="output" id="output"></div>
    </div>

    <!-- Input + palette (palette anchored to same container) -->
    <div class="input-area">
      <div class="input-container">
        <div class="prompt-chips" id="promptChips"></div>
        <div class="input-anchor">
          <div class="cmd-palette" id="cmdPalette">
            <div class="palette-body" id="paletteBody"></div>
          </div>
          <div class="input-wrapper" id="inputWrapper">
            <span class="cursor-blink" id="cursorBlink"></span>
            <input class="cmd-input" id="cmd" type="text"
              placeholder="press / to explore"
              autocomplete="off" spellcheck="false" autofocus>
            <button class="slash-btn" id="slashBtn" data-tip="Commands">/</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Preview side (hidden until first command, built from project data by JS) -->
  <div class="preview-side" id="previewSide"></div>

</div>

<script>
  // ── Bio ──
  const bioData = [
    [{ t: 'Dani Tremonte' }, { t: '.', accent: true }],
    [
      { t: 'Product designer building AI experiences at scale at ', m: true },
      { t: 'LinkedIn', m: true, href: 'https://www.linkedin.com/in/danielletremonte/?skipRedirect=true' },
      { t: '. Also founder of ', m: true },
      { t: 'Everydrop', m: true, href: 'https://apps.apple.com/us/app/everydrop-baby-feeding-sleep/id6504111298' },
      { t: ', live on the App Store.', m: true }
    ]
  ];

  const bioEl = document.getElementById('bio');

  bioData.forEach((segs, idx) => {
    // Greeting sits ABOVE the name (designer mode), revealed on hover.
    // Cycles through languages every 3s.
    if (idx === 0) {
      const greet = document.createElement('span');
      greet.className = 'bio-greeting';
      greet.innerHTML = '<span class="wave">👋</span> <span class="greet-text"></span>';
      bioEl.appendChild(greet);

      // "Hi! Welcome." — each letter fades in (animation replays on hover via CSS)
      const greetTextEl = greet.querySelector('.greet-text');
      greetTextEl.innerHTML = 'Hi! Welcome'.split('').map((ch, i) =>
        `<span class="gl" style="animation-delay:${i * 30}ms">${ch === ' ' ? '&nbsp;' : ch}</span>`
      ).join('');
    }

    const lineEl = document.createElement('span');
    lineEl.className = 'bio-line' + (idx === 0 ? ' bio-name' : '');
    segs.forEach(seg => {
      const wrap = seg.href
        ? Object.assign(document.createElement('a'), {
            href: seg.href, target: '_blank',
            rel: 'noopener noreferrer', className: 'bio-link'
          })
        : document.createElement('span');
      // Per-link hover color: LinkedIn -> MCP blue, Everydrop -> its purple
      if (seg.href && seg.href.includes('linkedin'))   wrap.classList.add('link-mcp');
      if (seg.href && seg.href.includes('apps.apple')) wrap.classList.add('link-everydrop');
      if (seg.m && !seg.href) wrap.classList.add('is-muted');
      if (seg.accent) wrap.classList.add('bio-accent');
      wrap.textContent = seg.t;
      lineEl.appendChild(wrap);
    });
    bioEl.appendChild(lineEl);
  });

  // Pink dot cursor follows the mouse (shown only in designer mode).
  // Tinted to the open project's color; lightens over dark media.
  const cursorDot = document.getElementById('cursorDot');
  const cursorColors = {
    0: { base: '#2962FF', light: '#7DA2FF' }, // LinkedIn MCP (blue)
    1: { base: '#7C3AED', light: '#AA8BFC' }, // Everydrop (purple)
    2: { base: '#1F8A66', light: '#67D8AE' }  // AI Library (green)
  };
  let cursorBase = '', cursorLight = '';  // '' = default accent (pink)

  function setCursorColor(pi) {
    if (pi >= 0 && cursorColors[pi]) { cursorBase = cursorColors[pi].base; cursorLight = cursorColors[pi].light; }
    else { cursorBase = ''; cursorLight = ''; }
  }

  // Read the brightness of the media pixel directly under the cursor (0–255)
  const sampleCanvas = document.createElement('canvas');
  sampleCanvas.width = sampleCanvas.height = 1;
  const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });

  function luminanceAt(el, clientX, clientY) {
    const natW = el.videoWidth || el.naturalWidth;
    const natH = el.videoHeight || el.naturalHeight;
    if (!natW || !natH) return null;
    const rect = el.getBoundingClientRect();
    let sx = (clientX - rect.left) / rect.width  * natW;
    let sy = (clientY - rect.top)  / rect.height * natH;
    sx = Math.max(0, Math.min(natW - 1, sx));
    sy = Math.max(0, Math.min(natH - 1, sy));
    try {
      sctx.drawImage(el, sx, sy, 1, 1, 0, 0, 1, 1);
      const d = sctx.getImageData(0, 0, 1, 1).data;
      return 0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2];
    } catch (_) { return null; }
  }

  let lastX = -1, lastY = -1;

  // Decide the cursor color from whatever is under the last cursor position.
  // Uses elementFromPoint so it works even without movement (hover-in, scroll,
  // and changing video frames all re-sample via the loop below).
  function updateCursorColor() {
    if (!cursorBase) { cursorDot.style.background = ''; return; }
    if (lastX < 0) return;
    let useLight = false;
    const t = document.elementFromPoint(lastX, lastY);
    if (t && (t.tagName === 'VIDEO' || t.tagName === 'IMG') && t.closest('.preview-side')) {
      const lum = luminanceAt(t, lastX, lastY);
      useLight = lum !== null ? lum < 135 : (t.tagName === 'VIDEO');  // dark pixel → light cursor
    }
    cursorDot.style.background = useLight ? cursorLight : cursorBase;
  }

  document.addEventListener('mousemove', e => {
    lastX = e.clientX; lastY = e.clientY;
    cursorDot.style.left = lastX + 'px';
    cursorDot.style.top  = lastY + 'px';
    updateCursorColor();
  });

  // Re-sample continuously so the color updates the instant you hover in,
  // and keeps up with playing video frames and scrolling — no movement needed
  setInterval(updateCursorColor, 60);

  // ── Terminal ──
  const layoutEl     = document.getElementById('layout');
  const output       = document.getElementById('output');
  const cmdEl        = document.getElementById('cmd');
  const palette      = document.getElementById('cmdPalette');
  const paletteBody  = document.getElementById('paletteBody');
  const cursorBlink  = document.getElementById('cursorBlink');
  const slashBtn     = document.getElementById('slashBtn');
  const themeBtn     = document.getElementById('themeBtn');
  const promptChips  = document.getElementById('promptChips');

  // ── Mode: Coder (dark, terminal) ⇄ Designer (light, elegant) ──
  // </> icon for coder, paintbrush for designer
  const codeSVG  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>`;
  const brushSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>`;

  function updateThemeUI() {
    const designer = document.body.classList.contains('light');
    // The in-input mode toggle button was removed; mode switches via the / palette
    // or a typed command. Keep the guard in case the button is ever restored.
    if (themeBtn) {
      themeBtn.innerHTML   = designer ? codeSVG : brushSVG;
      themeBtn.dataset.tip = designer ? 'Dark' : 'Light';
    }
    setStatusBarColor(designer);
  }

  // Match the mobile status bar to the page background. iOS Safari won't repaint
  // when an existing theme-color tag is edited in place, so replace it wholesale.
  function setStatusBarColor(designer) {
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
    const tc = document.createElement('meta');
    tc.setAttribute('name', 'theme-color');
    tc.setAttribute('content', designer ? '#FAF9F7' : '#0C0C0C');
    document.head.appendChild(tc);
  }

  // Apply the mode change (no animation) — wrapped by the circular reveal below
  function applyMode(force) {
    if (force === 'designer')   document.body.classList.add('light');
    else if (force === 'coder') document.body.classList.remove('light');
    else                        document.body.classList.toggle('light');
    updateThemeUI();

    // If a project is open, re-render its prompts in the new mode's style
    if (typeof currentTopic !== 'undefined' && currentTopic &&
        currentTopic[0] === 'p' && currentProject >= 0) {
      removeMenu();
      menuActive = false;
      promptChips.classList.remove('visible');
      promptChips.innerHTML = '';
      output.querySelectorAll('.inline-chips').forEach(el => el.remove());
      showPrompts(currentProject);
    }
  }

  // optional force: 'coder' | 'designer' | undefined (toggle)
  function toggleTheme(force) {
    // Set the status bar color OUTSIDE the view transition. iOS Safari reads
    // theme-color from the transition's captured snapshot and ignores changes
    // made inside the callback, so we apply it before the transition and again
    // once it finishes (never only inside applyMode).
    const willDesigner = force === 'designer' ? true
                       : force === 'coder'    ? false
                       : !document.body.classList.contains('light');
    const reapplyStatusBar = () => setStatusBarColor(willDesigner);
    reapplyStatusBar();

    if (!document.startViewTransition) { applyMode(force); return; }

    // Project / about pages: smooth crossfade dissolve (handles the
    // chips↔list reflow). No circle — that's main-page only.
    if (hasSplit) {
      document.startViewTransition(() => applyMode(force)).finished.finally(reapplyStatusBar);
      return;
    }

    // Main page: circular reveal from the accent dot after the name.
    // The dot is a period glyph sitting on the baseline, so its visible position
    // is near the BOTTOM of the (tall) line box — not its vertical center.
    const el = document.querySelector('.bio-accent') || document.querySelector('.bio-name');
    let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    if (el) {
      const r = el.getBoundingClientRect();
      if (r.width) { cx = r.left + r.width / 2; cy = r.top + r.height * 0.78; }
    }
    document.documentElement.style.setProperty('--vt-x', cx + 'px');
    document.documentElement.style.setProperty('--vt-y', cy + 'px');
    document.documentElement.classList.add('vt-mode');

    const t = document.startViewTransition(() => applyMode(force));
    t.finished.finally(() => { document.documentElement.classList.remove('vt-mode'); reapplyStatusBar(); });
  }

  if (themeBtn) themeBtn.addEventListener('click', () => toggleTheme());
  updateThemeUI(); // default: dark mode

  const cmdHistory = [];
  let histIdx = -1;
  let hasSplit = false;
  let currentProject = -1;
  let currentTopic = null; // 'p0'..'p2' | 'about' — one topic on screen at a time

  const projects = [
    { id:1, name:'ChatGPT & LinkedIn Learning MCP',
      tags:'AI product design  ·  0→1 product  ·  Ambiguity & complexity',
      desc:['Brought LinkedIn Learning inside AI platforms like ChatGPT and','Copilot through an open-standard (MCP) integration. The goal was to','meet users where they were and give them access to their learning tools.'],
      media:[
        { type:'video', src:'assets/LiL-MCP-ChatGPT.mp4', label:'LinkedIn Learning inside ChatGPT' }
        // Hidden 2026-08-04 (per Dani): the two stills below the demo
        // { type:'image', src:'assets/MCP-video-in-chat.jpg',     label:'Video player inside the chat' },
        // { type:'image', src:'assets/MCP-video-full-screen.jpg', label:'Full-screen video mode' }
      ],
      qa:{
        problem:     'Companies give employees access to LinkedIn Learning through their plans. But employees increasingly work inside AI platforms instead of visiting a separate learning site, and they want learning personalized to them. So how might LinkedIn Learning surface personalized content directly inside those AI platforms?',
        challenge:   'Designing for shifting patterns owned by ChatGPT and Copilot. Each partner rendered things differently, with its own design rules, and no shared patterns or component library existed yet. I had to learn each platform\'s conventions to make the video experience feel native and delightful inside them. On top of that, the technical limits kept moving as the AI tools evolved, so I led many conversations across engineering and product to align on requirements.',
        constraints: 'Early on I explored more futuristic concepts, like voice-based AI learning inside Copilot in PowerPoint, or practice exercises in ChatGPT. But as we aligned with the partners, it became clear their products couldn\'t support those integrations yet, so we scoped down to our core video experience for the MVP. I mapped out a strategy that sequenced beta, V2, and future designs we could ship as we launched and validated.',
        solving:     'I mapped the core patterns of ChatGPT and Copilot and built a component library for Learning that worked across every AI agent. That gave us a consistent, reliable experience inside the agents, from the MVP through future versions with more complex patterns. To make it personal and engaging, I focused the experience on a few highly personalized videos, and let users expand a video into a full page inside ChatGPT and Copilot, so they could stay in the platform and navigate the whole course.',
        roleai:      'Lead designer, solo. I owned the experience end to end: problem definition, flows, prototypes, and the patterns others could build on. I worked across engineering, product, and the partner platforms we designed within (ChatGPT, Copilot). I prototyped in HTML with AI to validate interactions, transitions, and navigation. It was a fast way to move and to share with the broader product team for alignment.'
      } },
    { id:2, name:'Everydrop at the App Store',
      tags:'Founder  ·  0→1 product  ·  iOS  ·  Live',
      desc:['Founded Everydrop in 2024. A company, not a side project:','a breastfeeding app live on the App Store with real users,','production infrastructure, and content validated by lactation','consultants. Designed it, shipped it, now builds it end-to-end.'],
      media:[
        { type:'video', src:'assets/everydrop-demo-web.mp4', eager:true,  label:'Everydrop demo' },
        // Hidden 2026-08-04 (per Dani): phone cover image + logo animation
        // { type:'image', src:'assets/everydrop-app-phone.jpg',             label:'Everydrop on iPhone' },
        // { type:'video', src:'assets/everydrop-logo-animation.mp4',        label:'Logo animation' },
        { type:'video', src:'assets/everydrop-tracker-flow.mp4',          label:'Tracker flow' },
        { type:'video', src:'assets/everydrop-timer-animation.mp4',       label:'Timer animation' },
        { type:'video', src:'assets/everydrop-tracker-flow-activity.mp4?v=2', label:'Activity tracker flow' },
        { type:'video', src:'assets/everydrop-activity-animation.mp4',    label:'Activity animation' },
        { type:'video', src:'assets/everydrop-carousel.mp4',              label:'Onboarding carousel' },
        // { type:'image', src:'assets/everydrop-illustrations-small.jpg',   label:'Illustrations' },  // hidden 2026-07-02
        { type:'video', src:'assets/everydrop-dark-light-mode-animation.mp4', rate:0.6, label:'Dark and light mode' }
      ],
      qa:{
        summary:   'Everydrop is a company with a live product, not a vibe-coded demo: a breastfeeding app on the iOS App Store since 2024, running real production infrastructure (React Native + Expo, Supabase backend, authentication, App Store operations), with personalized feeding guidance and content validated by professional lactation consultants.',
        challenge: 'Doing everything solo: design, code, and content accuracy. The hardest part was earning trust: exhausted, anxious moms need answers they can rely on at 3am, so every piece of content is validated by lactation professionals before it ships.',
        impact:    'Live on the App Store since 2024 with real users and real feedback loops. Now designed, built, and shipped end-to-end by one person using Claude Code. The founder lens shapes every product decision.',
        role:      'Founder and the entire product team: research, design, code, content strategy, and App Store operations. Every screen, every line of copy, every feature decision.',
        process:   'The app is now built with Claude Code. Features go from idea to TestFlight without a dev team. AI also shapes the roadmap: the consultant chat is being redesigned as an AI assistant trained on expert-validated content.',
        decisions: 'Led with trust over features: calm UI for exhausted parents, progressive disclosure so nothing overwhelms at 3am, and content validated by lactation consultants. Built on a real stack (React Native, Expo, Supabase) so it could scale rather than just demo.',
        learnings: 'Running a live product taught me what mockups can\'t: retention, App Store reality, and how a single confusing screen costs you a user. Being the founder and the designer means owning the outcome, not just the artifact.'
      } },
    { id:3, name:'AI Design System for LinkedIn Learning',
      tags:'Design systems  ·  AI components  ·  Systems thinking',
      desc:['Created the AI design system library for LinkedIn Learning:','components, patterns, and tokens that gave 10+ designers','a shared language for shipping AI features fast.'],
      media:[
        { type:'image', src:'assets/project-LiL-AI-Library.jpg', label:'AI component library' }
      ],
      qa:{
        summary:   'The AI design system library for LinkedIn Learning: components, patterns, and tokens for AI features, giving every designer on the team a shared language for shipping AI experiences fast.',
        challenge: 'AI patterns were shifting under our feet. Guidance that made sense one quarter was outdated the next. The system had to be opinionated enough to keep 10+ designers consistent, yet flexible enough to evolve with the technology.',
        impact:    '10+ designers shipping AI features with a shared language: faster design reviews, consistent patterns across surfaces, and far less reinventing the wheel between teams.',
        role:      'Created and owned the library: defined the components, patterns, and tokens, documented them, and drove adoption across the design team.',
        process:   'The system itself encodes AI patterns (streaming states, loading behaviors, feedback loops) so designers don\'t reinvent them. Built in Figma with tokens structured to map directly to code.',
        decisions: 'Made the system opinionated about AI-specific states (streaming, loading, feedback, errors) so designers reach for a proven pattern instead of inventing one. Structured tokens to map directly to engineering\'s code.',
        learnings: 'A design system is only as good as its adoption. I learned to treat it like a product: document clearly, evangelize it, and keep evolving it as AI patterns matured.'
      } }
  ];

  // Build preview DOM from project data: one scrollable panel per
  // project, one full-height block per media asset
  const previewSide = document.getElementById('previewSide');

  projects.forEach((p, pi) => {
    const panel = document.createElement('div');
    panel.className   = 'preview-item';
    panel.dataset.idx = pi;

    p.media.forEach((m, mi) => {
      const block = document.createElement('div');
      block.className  = 'media-block';
      block.dataset.media = `${pi}-${mi}`;

      if (m.type === 'video') {
        const vid = document.createElement('video');
        vid.poster = m.src.replace(/\.mp4$/, '-poster.jpg');  // first-frame fallback
        vid.src = m.srcDesktop || m.src;  // desktop panel uses the HD source
        vid.muted = true;
        vid.playsInline = true;
        vid.preload = m.eager ? 'auto' : 'metadata';  // eager media buffers immediately
        vid.loop = true;
        if (m.rate) { vid.playbackRate = m.rate; vid.addEventListener('play', () => vid.playbackRate = m.rate); }
        block.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src = m.src;
        img.alt = m.label;
        block.appendChild(img);
      }

      panel.appendChild(block);
    });

    previewSide.appendChild(panel);
  });

  // About panel — photo(s) shown on the right when 'about' runs.
  // Add more entries here as assets are added.
  const aboutMedia = [
    { type:'image', src:'assets/photo-hero.jpg', alt:'Dani Tremonte' }
  ];

  const aboutPanel = document.createElement('div');
  aboutPanel.className = 'preview-item';
  aboutMedia.forEach(m => {
    const block = document.createElement('div');
    block.className = 'media-block blob';
    const img = document.createElement('img');
    img.src = m.src;
    img.alt = m.alt;
    block.appendChild(img);
    aboutPanel.appendChild(block);
  });
  previewSide.appendChild(aboutPanel);

  const previewItems = document.querySelectorAll('.preview-item');
  const ABOUT_IDX    = projects.length; // about panel sits after the projects

  // Desktop: as the active panel scrolls, play/pause its videos by visibility
  previewItems.forEach(panel => {
    panel.addEventListener('scroll', () => {
      if (panel.classList.contains('active')) syncPanelVideos(panel);
    }, { passive: true });
  });

  // Palette groups — command only, no descriptions
  const paletteGroups = [
    { section: 'Projects', items: [
      { label:'Everydrop',             cmd:'everydrop'             },
      { label:'LinkedIn Learning MCP', cmd:'linkedin learning mcp' },
      // AI Library temporarily hidden
    ]},
    { section: 'Info', items: [
      { label:'intro', cmd:'intro' },   // back to the landing page (was 'clear')
      { label:'about', cmd:'about' },
    ]},
    { section: '', items: [
      { dynamic:'mode' },
    ]},
  ];

  // Resolve dynamic palette rows (e.g. the mode toggle reflects current mode)
  function resolveItem(item) {
    if (item.dynamic === 'mode') {
      const designer = document.body.classList.contains('light');
      return { label: designer ? 'dark mode' : 'light mode',
               cmd:   designer ? 'dark'      : 'light' };
    }
    return item;
  }

  let selIdx = 0;

  function getPaletteItems() { return Array.from(paletteBody.querySelectorAll('.palette-item')); }

  function selectPaletteItem(idx) {
    const items = getPaletteItems();
    items.forEach(el => el.classList.remove('selected'));
    if (idx < 0) { selIdx = -1; return; }   // clear selection (nothing open)
    if (items.length) {
      selIdx = Math.max(0, Math.min(idx, items.length - 1));
      items[selIdx].classList.add('selected');
      items[selIdx].scrollIntoView({ block: 'nearest' });
    }
  }

  // VSCode-style: filter rows live as the user types after "/"
  function renderPalette(query = '') {
    paletteBody.innerHTML = '';
    paletteGroups.forEach(group => {
      const matches = group.items.map(resolveItem).filter(i => i.label.toLowerCase().includes(query));
      if (!matches.length) return;

      if (group.section) {   // groups with no title render their items header-less
        const sec = document.createElement('div');
        sec.className   = 'palette-section';
        sec.textContent = group.section;
        paletteBody.appendChild(sec);
      }

      matches.forEach(item => {
        const row = document.createElement('div');
        row.className = 'palette-item';
        if (item.cmd) row.dataset.cmd = item.cmd;
        row.innerHTML = `<span class="palette-item-label">${item.label}</span>`;
        row.addEventListener('click', () => executePaletteCmd(item.cmd));
        paletteBody.appendChild(row);
      });
    });
    // No query: highlight whatever is open; on the main page (nothing open)
    // highlight nothing. While filtering, highlight the first match.
    const cur = currentCmd();
    if (!query && cur) {
      const idx = getPaletteItems().findIndex(el => el.dataset.cmd === cur);
      selectPaletteItem(idx >= 0 ? idx : 0);
    } else if (query) {
      selectPaletteItem(0);
    } else {
      selectPaletteItem(-1);
    }
  }

  // The command string for whatever topic is currently on screen
  function currentCmd() {
    if (currentTopic && currentTopic[0] === 'p') return projCmds[parseInt(currentTopic.slice(1))];
    if (currentTopic === 'about') return 'about';
    return null;
  }

  const sheetBackdrop = document.getElementById('sheetBackdrop');

  function showPalette(query = '') {
    renderPalette(query);
    palette.classList.add('visible');
    sheetBackdrop.classList.add('visible');
  }

  function hidePalette() {
    palette.classList.remove('visible');
    sheetBackdrop.classList.remove('visible');
    if (!isMobile()) cmdEl.focus();
  }

  // Tap the dim backdrop to dismiss the mobile bottom sheet
  sheetBackdrop.addEventListener('click', () => { cmdEl.value = ''; updateCursor(); hidePalette(); });

  function executePaletteCmd(cmd) {
    hidePalette();
    cmdEl.value = '';
    updateCursor();
    run(cmd);
  }

  // Click outside the palette closes it
  document.addEventListener('click', e => {
    if (!palette.classList.contains('visible')) return;
    if (palette.contains(e.target) || slashBtn.contains(e.target)) return;
    hidePalette();
  });

  // ── Output helpers ──
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function triggerSplit() {
    if (!hasSplit) {
      hasSplit = true;
      layoutEl.classList.add('is-split');
      bioEl.classList.add('is-up');
    }
  }

  // Sequential reveal queue — lines appear one after another (~45ms apart)
  const revealQueue = [];
  let revealTimer = null;

  // Desktop pins output to the bottom (terminal style); mobile reads
  // top-down, so new content must not yank the scroll position
  function autoScroll() {
    if (!isMobile()) output.scrollTop = output.scrollHeight;
  }

  function scheduleReveal(el) {
    revealQueue.push(el);
    if (!revealTimer) {
      revealTimer = setInterval(() => {
        const next = revealQueue.shift();
        if (!next) { clearInterval(revealTimer); revealTimer = null; return; }
        next.classList.remove('pending');
        autoScroll();
      }, 45);
    }
  }

  function line(text, cls = '') {
    triggerSplit();
    const d = document.createElement('div');
    d.className = 'out-line pending ' + cls;
    d.innerHTML = text;
    output.appendChild(d);
    autoScroll();
    scheduleReveal(d);
    return d;
  }

  function blank() {
    const d = document.createElement('div');
    d.className = 'out-line is-blank pending';
    output.appendChild(d);
    autoScroll();
    scheduleReveal(d);
  }

  // ── Mobile detection ──
  const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

  // Inline media line: a video/img flowing inside the output (mobile)
  function mediaLine(node) {
    triggerSplit();
    const d = document.createElement('div');
    d.className = 'out-line media-line pending';
    d.appendChild(node);
    output.appendChild(d);
    autoScroll();
    scheduleReveal(d);
  }

  // Mobile inline videos: play while ≥1/3 in the viewport, pause otherwise.
  // We track in-view state so a clip that isn't buffered yet can start the
  // moment it's ready (see the 'canplay' retry in inlineProjectMedia).
  const inlineVideoObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const v = e.target;
      if (e.isIntersecting && e.intersectionRatio >= 0.34) {
        v.dataset.inview = '1';
        v.play().catch(() => {});
      } else {
        v.dataset.inview = '0';
        v.pause();
      }
    });
  }, { threshold: [0, 0.34, 0.7, 1] });

  function inlineProjectMedia(pi) {
    projects[pi].media.forEach(m => {
      let node;
      if (m.type === 'video') {
        node = document.createElement('video');
        // Poster (first frame) guarantees the clip always shows something even
        // when iOS won't play an off-screen video — no more blank/disappearing.
        node.poster = m.src.replace(/\.mp4$/, '-poster.jpg');
        node.muted = true;
        node.defaultMuted = true;
        node.setAttribute('muted', '');
        node.setAttribute('playsinline', '');
        node.setAttribute('webkit-playsinline', '');
        node.setAttribute('loop', '');
        node.setAttribute('preload', 'auto');   // buffer eagerly so it can play on entry
        node.dataset.inview = '0';
        node.src = m.src;
        if (m.rate) { node.playbackRate = m.rate; node.addEventListener('play', () => node.playbackRate = m.rate); }
        // If the clip is in view but wasn't buffered when first asked to play,
        // start it as soon as it has enough data.
        node.addEventListener('canplay', () => { if (node.dataset.inview === '1') node.play().catch(() => {}); });
        node.load();  // kick off buffering immediately on page entry
        // Animate clips as they scroll into view (they still show their poster otherwise)
        inlineVideoObserver.observe(node);
      } else {
        node = document.createElement('img');
        node.src = m.src;
        node.alt = m.label;
      }
      mediaLine(node);
    });
    blank();
  }

  // ── Preview ──
  // Play a panel's videos only while ≥1/3 visible inside the scrolling panel
  function syncPanelVideos(panel) {
    const pr = panel.getBoundingClientRect();
    panel.querySelectorAll('video').forEach(vid => {
      const r = vid.getBoundingClientRect();
      const visible = Math.max(0, Math.min(r.bottom, pr.bottom) - Math.max(r.top, pr.top));
      const ratio = r.height ? visible / r.height : 0;
      if (ratio >= 0.34) { if (vid.paused) vid.play().catch(() => {}); }
      else if (!vid.paused) vid.pause();
    });
  }

  function showPreview(idx) {
    previewItems.forEach((item, i) => {
      const active = i === idx;
      item.classList.toggle('active', active);
      // Pause + reset every video; the visible ones resume below
      item.querySelectorAll('video').forEach(v => { v.pause(); v.currentTime = 0; });
      if (active) {
        item.scrollTop = 0;
        // First video always starts right away on load
        const firstVid = item.querySelector('video');
        if (firstVid) firstVid.play().catch(() => {});
        requestAnimationFrame(() => syncPanelVideos(item));
      }
    });
  }

  // ── Suggested prompt chips (questions recruiters actually ask) ──
  // Shows 3 at a time; clicking one streams in the next from the pool.
  const promptDefs = [
    { key:'problem',     label:'Problem statement'        },
    { key:'challenge',   label:'Biggest challenge'        },
    { key:'impact',      label:'Impact & outcomes'        },
    { key:'constraints', label:'Other constraints'        },
    { key:'solving',     label:'Solving challenges'       },
    { key:'roleai',      label:"Dani's role and using AI" },
    { key:'role',        label:"What was Dani's role?"    },
    { key:'process',     label:'How was AI used?'         },
    { key:'decisions',   label:'Key design decisions'     },
    { key:'learnings',   label:'What she learned'         }
  ];

  let promptQueue = [];
  let chipHost = promptChips;  // bar (desktop) or an output-flow container (mobile)

  function buildChip(pd) {
    const chip = document.createElement('button');
    chip.className   = 'chip chip-p' + currentProject + ((pd.nav || pd.cta) ? ' chip-nav' : '');
    chip.textContent = pd.label;
    chip.addEventListener('click', () => {
      if (pd.nav) { const c = otherVisibleProjectCmd(); if (c) run(c); return; }
      if (currentProject < 0) return;
      // CTA chip: not a qa answer — a note that this is an overview + a way to reach out
      if (pd.cta) {
        const cc = cmdColorClass(currentProject);
        line(`<span class="sym ${cc}">$</span> <span class="${cc}">full case study</span>`, 'is-cmd');
        line('This is the short version. The full case study, with the process, the messy middle, and the results in depth, is something I walk through live. <a class="cta-link" href="mailto:dani.tremonte@gmail.com">Let\'s talk over email</a>.', 'is-resp');
        blank();
        // CTA used → replace it with the next queued prompt so the button count holds
        const ctaNext = promptQueue.shift();
        if (ctaNext) {
          chip.replaceWith(buildChip(ctaNext));
        } else {
          chip.remove();
          if (!chipHost.querySelector('.chip')) {
            chipHost.appendChild(buildChip({ nav: true, label: 'Show another project' }));
          }
        }
        if (chipHost.parentNode === output) output.appendChild(chipHost);
        if (!isMobile()) cmdEl.focus();
        return;
      }
      const cc = cmdColorClass(currentProject);
      line(`<span class="sym ${cc}">$</span> <span class="${cc}">${esc(pd.label.toLowerCase())}</span>`, 'is-cmd');
      line(esc(projects[currentProject].qa[pd.key]), 'is-resp');
      blank();
      const next = promptQueue.shift();
      if (next) {
        chip.replaceWith(buildChip(next));
      } else {
        chip.remove();
        // Out of questions → offer to jump to another project
        if (!chipHost.querySelector('.chip:not(.chip-nav)')) {
          chipHost.appendChild(buildChip({ nav: true, label: 'Show another project' }));
        }
      }
      // Mobile: keep the chips below the newest answer
      if (chipHost.parentNode === output) output.appendChild(chipHost);
      if (!isMobile()) cmdEl.focus();
    });
    return chip;
  }

  function resetChips() {
    // Only show prompts this project has an answer for (e.g. MCP has no "impact")
    const defs = projects[currentProject] ? promptDefs.filter(pd => projects[currentProject].qa[pd.key]) : promptDefs;
    promptQueue = defs.slice(2);
    if (isMobile()) {
      // Mobile: chips flow in the output, after the media
      chipHost = document.createElement('div');
      chipHost.className = 'prompt-chips inline-chips visible';
      output.appendChild(chipHost);
    } else {
      chipHost = promptChips;
      promptChips.innerHTML = '';
      promptChips.classList.add('visible');
    }
    // Show only 2 prompts at start so that, with the persistent CTA, exactly 3 chips appear
    defs.slice(0, 2).forEach(pd => chipHost.appendChild(buildChip(pd)));
    // Persistent CTA chip: recruiters can always jump to the "full case study" (routes to contact)
    chipHost.appendChild(buildChip({ cta: true, label: 'Full case study' }));
  }

  // ── Coder-mode terminal prompt list (numbered, keyboard-navigable) ──
  let menuItems = [], menuQueue = [], menuSel = 0, menuActive = false, menuEl = null, menuPi = -1;

  function removeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }

  function updateMenuSel() {
    if (!menuEl) return;
    menuEl.querySelectorAll('.menu-opt').forEach((o, i) => o.classList.toggle('sel', i === menuSel));
  }

  function renderMenu() {
    removeMenu();
    const wrap = document.createElement('div');
    wrap.className = 'out-line menu menu-p' + menuPi;
    const navOnly = menuItems.length === 1 && menuItems[0].nav;
    let html = `<div class="menu-q">${navOnly ? 'Want to see more?' : 'What else do you want to know?'}</div>`;
    menuItems.forEach((it, i) => {
      html += `<div class="menu-opt${i === menuSel ? ' sel' : ''}" data-i="${i}">` +
              `<span class="caret">›</span> ${i + 1}. ${esc(it.label)}</div>`;
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('.menu-opt').forEach(o => {
      o.addEventListener('mouseenter', () => { menuSel = +o.dataset.i; updateMenuSel(); });
      o.addEventListener('click',      () => pickMenu(+o.dataset.i));
    });
    output.appendChild(wrap);
    menuEl = wrap;
    autoScroll();
  }

  // Render only after the typewriter reveal above finishes
  function scheduleMenu() {
    const delay = revealQueue.length * 45 + 80;
    const pi = menuPi;
    setTimeout(() => { if (menuActive && menuPi === pi) renderMenu(); }, delay);
  }

  function startMenu(pi) {
    menuPi = pi;
    menuItems = promptDefs.slice(0, 3);
    menuQueue = promptDefs.slice(3);
    menuSel = 0;
    menuActive = true;
    scheduleMenu();
  }

  function moveMenu(d) {
    if (!menuItems.length) return;
    menuSel = (menuSel + d + menuItems.length) % menuItems.length;
    updateMenuSel();
  }

  function pickMenu(idx) {
    const it = menuItems[idx];
    if (!it || menuPi < 0) return;
    if (it.nav) { removeMenu(); menuActive = false; const c = otherVisibleProjectCmd(); if (c) run(c); return; }
    const cc = cmdColorClass(menuPi);
    removeMenu();
    line(`<span class="sym ${cc}">$</span> <span class="${cc}">${esc(it.label.toLowerCase())}</span>`, 'is-cmd');
    line(esc(projects[menuPi].qa[it.key]), 'is-resp');
    blank();
    menuItems = menuItems.filter((_, i) => i !== idx);
    if (menuQueue.length) menuItems.push(menuQueue.shift());
    menuSel = 0;
    // Out of questions → offer to jump to another project (never a dead end)
    if (!menuItems.length) menuItems = [{ nav: true, label: 'Show another project' }];
    scheduleMenu();
    if (!isMobile()) cmdEl.focus();
  }

  // Pick prompt UI by mode: terminal list (coder) vs chips (designer)
  function showPrompts(pi) {
    // Both modes now use the pill/chip prompts (the numbered terminal menu was
    // retired per design feedback). resetChips handles desktop + mobile.
    resetChips();
  }

  // Project command names, in project order ('mcp' kept as a short alias)
  const projCmds = ['linkedin learning mcp', 'everydrop', 'ai library'];
  const HIDDEN_PROJECTS = new Set([2]); // AI Library temporarily hidden

  // Command for the next visible project that isn't the current one
  function otherVisibleProjectCmd() {
    for (let i = 0; i < projCmds.length; i++) {
      if (HIDDEN_PROJECTS.has(i) || i === currentProject) continue;
      return projCmds[i];
    }
    return null;
  }

  // Maps any command string to its project index, or -1
  function projFromCmd(lower) {
    let idx = -1;
    if (projCmds.includes(lower)) idx = projCmds.indexOf(lower);
    else if (lower === 'mcp') idx = 0;
    else if (/^(open|project) [1-3]$/.test(lower)) idx = parseInt(lower.split(' ')[1]) - 1;
    return HIDDEN_PROJECTS.has(idx) ? -1 : idx;
  }

  // Per-project color class for the % and prompt text
  function cmdColorClass(pi) {
    return pi >= 0 ? `cmd-p${pi}` : '';
  }

  // On the very first command the panel expands from 0 to 2/3 width. Wait for
  // that to finish, then fade the video in at full size (no stretch). On later
  // commands the panel is already open, so show immediately.
  function revealPreview(idx, justSplit, stillValid) {
    if (justSplit) {
      setTimeout(() => { if (stillValid()) showPreview(idx); }, 580);
    } else {
      showPreview(idx);
    }
  }

  function openProject(pi, justSplit) {
    const p = projects[pi];
    blank();
    line(p.name, 'is-bright');
    line(p.tags, 'is-tags');
    blank();
    line(esc(p.desc.join(' ')), 'is-resp');
    line('📣 This is a quick overview, not a full case study.', 'is-resp');
    blank();
    if (isMobile()) {
      inlineProjectMedia(pi);  // media flows into the output like a feed
    } else {
      revealPreview(pi, justSplit, () => currentProject === pi);
    }
    currentProject = pi;
    cmdEl.className = 'cmd-input';
    setCursorColor(pi);
    showPrompts(pi);
  }

    line('Dani Tremonte', 'is-bright');

    line('Most recently at LinkedIn Learning, designing AI at scale: from discovery and strategy to shipped features, design systems, and cross-functional execution.', 'is-resp');
    blank();
    line('Also the founder of Everydrop, a company with a live iOS app on the App Store: real users, production infrastructure, and content validated by lactation professionals. She ships her own features end-to-end with Claude Code. That founder lens shapes everything she designs.', 'is-resp');
    blank();

    line(`LinkedIn   <a class="term-link" href="https://www.linkedin.com/in/danielletremonte/?skipRedirect=true" target="_blank" rel="noopener">danielletremonte ↗</a>`, 'is-resp');

  // Clears the conversation without resetting the layout (topic switch)
  function softClear() {
    revealQueue.length = 0;
    output.innerHTML = '';
    promptChips.classList.remove('visible');
    promptChips.innerHTML = '';
    menuActive = false;
    menuEl = null;
    menuPi = -1;

  // ── Run command ──
  function run(raw) {
    const cmd   = raw.trim();
    const lower = cmd.toLowerCase();

    if (!cmd) return;

    // Always dismiss the command sheet/backdrop before running anything
    if (palette.classList.contains('visible')) hidePalette();

    // Bare number picks a prompt from the coder-mode terminal list
    if (menuActive && /^[1-9]$/.test(lower)) {
      const i = parseInt(lower) - 1;
      if (i < menuItems.length) { pickMenu(i); return; }
    }

    // Mode switch — handle before anything else (so mode words aren't read as about).
    // Light = light/design mode, Dark = dark/dev mode. Old words kept as aliases.
    if (['light', 'dark', 'light mode', 'dark mode', 'canvas', 'terminal', 'designer', 'coder', 'theme'].includes(lower)) {
      const force = (lower === 'light' || lower === 'light mode' || lower === 'canvas' || lower === 'designer') ? 'designer'
                  : (lower === 'dark'  || lower === 'dark mode'  || lower === 'terminal' || lower === 'coder')  ? 'coder'
                  : undefined;
      const onProject = currentTopic && currentTopic[0] === 'p';
      toggleTheme(force);
      // Stay quiet while a project is open (don't interrupt the case study)
      if (hasSplit && !onProject) {
        line(`<span class="sym">$</span> ${esc(lower)}`, 'is-cmd');
        line(`switched to ${document.body.classList.contains('light') ? 'light' : 'dark'} mode`, 'is-resp');
        blank();
      }
      return;
    }

    let   projIdx     = projFromCmd(lower);
    const isContact   = /contact|email|reach|hire|get in touch/.test(lower);
    const isAbout     = lower === 'about' ||
      /\bdani\b|\bwho\b|experience|background|resume|\bcv\b|designer|yourself/.test(lower);
    const onAboutPage = currentTopic === 'about';
    const isWorkQuery = /work|experience|career|background|companies|company|linkedin|resume|history|profile|previous|past/.test(lower);

    // On the about page, questions about work/experience → career summary
    const showExp = onAboutPage && isWorkQuery && projIdx < 0 && !isContact;

    // Elsewhere, natural language about the work ("show me a project", "case
    // study", etc.) → open Everydrop (the strongest case study) instead of erroring
    if (!showExp && projIdx < 0 && !isContact && !isAbout &&
        /project|work|case ?stud|portfolio|show me|show a|\bapp\b|built|building|\bdesign\b|example/.test(lower)) {
      projIdx = 1; // Everydrop
    }

    const cc        = cmdColorClass(projIdx);

    // One topic on screen at a time — switching topics clears the old conversation
    const topic = projIdx >= 0 ? 'p' + projIdx
                : (isContact || isAbout) ? 'about'
                : null;
    if (topic && topic !== currentTopic) {
      softClear();
      currentTopic = topic;
    }

    // Capture before the echo line triggers the layout split
    const justSplit = !hasSplit;

    const echoEl = line(`<span class="sym ${cc}">$</span> <span class="${cc}">${esc(raw)}</span>`, 'is-cmd');

    // Mobile: bring the new command to the top so reading starts there
    if (isMobile()) {
      setTimeout(() => { output.scrollTop = echoEl.offsetTop - output.offsetTop; }, 60);
    }

    if (projIdx >= 0) {
      openProject(projIdx, justSplit);

    } else if (isContact) {
      showContact(justSplit);

    } else if (showExp) {
      showExperience();

    } else if (isAbout) {
      showAbout(justSplit);

    } else if (lower === 'intro' || lower === 'clear') {
      // Back to the landing page. Staged exit: right panel fades → left panel fades → main page slides in
      hasSplit = false;
      currentProject = -1;
      currentTopic = null;
      setCursorColor(-1);
      cmdEl.className = 'cmd-input';

      const EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';

      // 1) fade out the right preview panel (videos/images)
      previewSide.style.transition = `opacity 0.2s ${EASE}`;
      previewSide.style.opacity = '0';

      // 2) then fade out the left panel — output text AND the prompt chips bar
      setTimeout(() => {
        output.style.transition = `opacity 0.18s ${EASE}`;
        output.style.opacity = '0';
        promptChips.style.transition = `opacity 0.18s ${EASE}`;
        promptChips.style.opacity = '0';
      }, 90);

      // 3) then slide + fade the main page back in
      setTimeout(() => {
        layoutEl.classList.remove('is-split');
        bioEl.classList.remove('is-up');
      }, 200);

      // 4) cleanup once the main page has slid in
      setTimeout(() => {
        softClear();
        showPreview(-1);
        previewSide.style.transition = ''; previewSide.style.opacity = '';
        output.style.transition = '';      output.style.opacity = '';
        promptChips.style.transition = ''; promptChips.style.opacity = '';
      }, 780);

    } else {
      line(`command not found: ${esc(cmd)}  ·  press '/' for commands`, 'is-error');
      blank();
    }
  }

  // Cursor blink toggle
  function updateCursor() {
    const empty = cmdEl.value === '';
    cursorBlink.classList.toggle('hidden', !empty);
    cmdEl.style.caretColor = empty ? 'transparent' : 'var(--accent)';
  }

  // Typing "/" opens the palette; further letters filter it live (VSCode-style)
  cmdEl.addEventListener('input', () => {
    updateCursor();
    const v = cmdEl.value;
    if (v.startsWith('/')) {
      showPalette(v.slice(1).toLowerCase());
    } else if (palette.classList.contains('visible')) {
      hidePalette();
    }
  });

  cmdEl.addEventListener('keydown', e => {
    const paletteOpen = palette.classList.contains('visible');

    if (paletteOpen) {
      const items = getPaletteItems();
      if (e.key === 'ArrowDown') { e.preventDefault(); selectPaletteItem(selIdx + 1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); selectPaletteItem(selIdx - 1); return; }
      if (e.key === 'Enter')     { e.preventDefault(); if (items[selIdx]) items[selIdx].click(); return; }
      if (e.key === 'Escape')    { cmdEl.value = ''; updateCursor(); hidePalette(); return; }
    }

    // Terminal prompt list nav (coder mode) when input is empty
    if (menuActive && menuEl && cmdEl.value === '') {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveMenu(1);  return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); moveMenu(-1); return; }
      if (e.key === 'Enter')     { e.preventDefault(); pickMenu(menuSel); return; }
    }

    if (e.key === 'Enter') {
      const val = cmdEl.value;
      if (val.trim()) { cmdHistory.unshift(val); histIdx = -1; }
      cmdEl.value = '';
      updateCursor();
      run(val);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (histIdx < cmdHistory.length-1) { cmdEl.value = cmdHistory[++histIdx]; updateCursor(); }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      histIdx > 0 ? (cmdEl.value = cmdHistory[--histIdx]) : (histIdx=-1, cmdEl.value='');
      updateCursor();
    }
  });

  slashBtn.addEventListener('click', () => {
    if (palette.classList.contains('visible')) {
      cmdEl.value = '';
      updateCursor();
      hidePalette();
    } else if (isMobile()) {
      // Mobile: open as a bottom sheet, no input focus (avoids keyboard + zoom)
      showPalette('');
    } else {
      cmdEl.value = '/';
      updateCursor();
      cmdEl.focus();
      showPalette('');
    }
  });
  document.getElementById('terminal').addEventListener('click', () => {
    if (!isMobile()) cmdEl.focus();
  });
</script>

</body>
</html>
